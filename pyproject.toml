[project]
name = "deep-agents"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "malik09-teach", email = "malikabbaskhan477@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "deepagents>=0.7.19",
    "fastapi>=0.141.1",
    "flask>=3.1.3",
    "ipykernel>=7.3.0",
    "langchain>=1.4.2",
    "langchain-community>=0.4.2",
    "langchain-core>=1.6.5",
    "langchain-experimental>=0.4.2",
    "langchain-google-genai>=4.4.0",
    "langchain-groq>=1.1.3",
    "langchain-tavily>=0.2.18",
    "langgraph>=1.2.12",
    "langgraph-sdk>=0.4.5",
    "pdfplumber>=0.11.10",
    "python-dotenv>=1.2.3",
    "tavily-python>=0.8.4",
]

[project.scripts]
deep-agents = "deep_agents:main"

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"
