<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>5G Predictive Raycast - 10s Sim</title>
    <style>
        body {
            background: #0f172a;
            color: #e2e8f0;
            font-family: system-ui;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
            margin: 0;
        }

        .dashboard {
            display: flex;
            gap: 20px;
            margin-bottom: 15px;
            width: 800px;
        }

        .panel {
            background: #1e293b;
            padding: 15px;
            border-radius: 8px;
            flex: 1;
            border: 1px solid #334155;
        }

        .controls {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 15px;
            width: 800px;
            background: #1e293b;
            padding: 10px 20px;
            border-radius: 8px;
            border: 1px solid #334155;
            box-sizing: border-box;
        }

        canvas {
            background: #020617;
            border: 1px solid #334155;
            border-radius: 8px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.5);
        }

        button {
            background: #3b82f6;
            color: white;
            border: none;
            padding: 8px 16px;
            border-radius: 4px;
            cursor: pointer;
            font-weight: bold;
        }

        button:hover {
            background: #2563eb;
        }

        .signal-bar-bg {
            width: 100%;
            height: 20px;
            background: #334155;
            border-radius: 10px;
            overflow: hidden;
            margin-top: 5px;
        }

        .signal-bar-fill {
            height: 100%;
            width: 100%;
            background: #22c55e;
            transition: width 0.1s, background 0.1s;
        }

        label {
            cursor: pointer;
            font-weight: bold;
            display: flex;
            align-items: center;
            gap: 8px;
            color: #38bdf8;
        }

        input[type="checkbox"] {
            transform: scale(1.2);
        }
    </style>
</head>

<body>

    <div class="controls">
        <button onclick="resetSim()">Start 10s Simulation</button>
        <label>
            <input type="checkbox" id="aiToggle" checked>
            Predictive AI (Velocity Vector Look-Ahead)
        </label>
    </div>

    <div class="dashboard">
        <div class="panel" id="panelA">
            <strong>Tower A (Primary)</strong>
            <div style="font-family: monospace; margin-top: 5px;">RSRP: <span id="rsrpA">-50</span> dBm</div>
            <div class="signal-bar-bg">
                <div class="signal-bar-fill" id="barA"></div>
            </div>
        </div>
        <div class="panel" id="panelB">
            <strong>Tower B (Target)</strong>
            <div style="font-family: monospace; margin-top: 5px;">RSRP: <span id="rsrpB">-70</span> dBm</div>
            <div class="signal-bar-bg">
                <div class="signal-bar-fill" id="barB"></div>
            </div>
        </div>
    </div>

    <canvas id="simCanvas" width="800" height="400"></canvas>

    <script>
        const canvas = document.getElementById('simCanvas');
        const ctx = canvas.getContext('2d');

        const towers = {
            A: { x: 100, y: 100, color: '#22c55e' },
            B: { x: 700, y: 100, color: '#f59e0b' }
        };

        const building = { x: 350, y: 150, width: 120, height: 250 };

        // Speed adjusted specifically so crossing the building takes place perfectly within 10 seconds (600 frames)
        let user = { x: 50, y: 320, vx: 1.15, vy: -0.15 };
        let activeTower = 'A';
        let rsrpA = -50, rsrpB = -70;

        let animationId;
        let startTime = null;
        const SIMULATION_DURATION_MS = 10000; // Exactly 10 seconds

        function linesIntersect(a, b, c, d, p, q, r, s) {
            let det, gamma, lambda;
            det = (c - a) * (s - q) - (r - p) * (d - b);
            if (det === 0) return false;
            lambda = ((s - q) * (r - a) + (p - r) * (s - b)) / det;
            gamma = ((b - d) * (r - a) + (c - a) * (s - b)) / det;
            return (0 < lambda && lambda < 1) && (0 < gamma && gamma < 1);
        }

        function checkLineOfSight(x1, y1, x2, y2) {
            const bl = building;
            const walls = [
                [bl.x, bl.y, bl.x + bl.width, bl.y],
                [bl.x + bl.width, bl.y, bl.x + bl.width, bl.y + bl.height],
                [bl.x, bl.y + bl.height, bl.x + bl.width, bl.y + bl.height],
                [bl.x, bl.y, bl.x, bl.y + bl.height]
            ];
            for (let w of walls) {
                if (linesIntersect(x1, y1, x2, y2, w[0], w[1], w[2], w[3])) return false;
            }
            return true;
        }

        function calculateSignal(towerX, towerY, userX, userY) {
            const dist = Math.hypot(towerX - userX, towerY - userY);
            const hasLoS = checkLineOfSight(towerX, towerY, userX, userY);
            let signal = -40 - (dist * 0.05);
            if (!hasLoS) signal -= 45;
            return Math.max(-120, Math.min(-40, signal));
        }

        function updateDashboard() {
            const pctA = Math.max(0, (rsrpA + 120) / 80 * 100);
            const pctB = Math.max(0, (rsrpB + 120) / 80 * 100);

            document.getElementById('rsrpA').innerText = Math.round(rsrpA);
            document.getElementById('barA').style.width = pctA + '%';
            document.getElementById('barA').style.background = rsrpA < -90 ? '#ef4444' : '#22c55e';
            document.getElementById('panelA').style.borderColor = activeTower === 'A' ? '#22c55e' : '#334155';

            document.getElementById('rsrpB').innerText = Math.round(rsrpB);
            document.getElementById('barB').style.width = pctB + '%';
            document.getElementById('barB').style.background = rsrpB < -90 ? '#ef4444' : '#f59e0b';
            document.getElementById('panelB').style.borderColor = activeTower === 'B' ? '#f59e0b' : '#334155';
        }

        function drawScene(timestamp) {
            if (!startTime) startTime = timestamp;
            const elapsedMs = timestamp - startTime;
            const timeLeftStr = Math.max(0, (SIMULATION_DURATION_MS - elapsedMs) / 1000).toFixed(1);

            ctx.clearRect(0, 0, canvas.width, canvas.height);

            rsrpA = calculateSignal(towers.A.x, towers.A.y, user.x, user.y);
            rsrpB = calculateSignal(towers.B.x, towers.B.y, user.x, user.y);
            const aiEnabled = document.getElementById('aiToggle').checked;

            if (aiEnabled) {
                // Increased lookAhead to 45 frames due to slower velocity for the 10s timing
                const lookAheadFrames = 45;
                const futureX = user.x + (user.vx * lookAheadFrames);
                const futureY = user.y + (user.vy * lookAheadFrames);

                ctx.beginPath();
                ctx.setLineDash([5, 5]);
                ctx.moveTo(user.x, user.y);
                ctx.lineTo(futureX, futureY);
                ctx.strokeStyle = '#38bdf8';
                ctx.stroke();
                ctx.setLineDash([]);
                ctx.beginPath(); ctx.arc(futureX, futureY, 4, 0, Math.PI * 2); ctx.fillStyle = '#38bdf8'; ctx.fill();

                const futureRsrpA = calculateSignal(towers.A.x, towers.A.y, futureX, futureY);
                const futureRsrpB = calculateSignal(towers.B.x, towers.B.y, futureX, futureY);

                if (activeTower === 'A' && futureRsrpA < -85 && futureRsrpB > futureRsrpA) {
                    activeTower = 'B';
                }
            } else {
                if (activeTower === 'A' && rsrpA < -95) {
                    activeTower = 'B';
                }
            }

            ctx.fillStyle = '#334155';
            ctx.fillRect(building.x, building.y, building.width, building.height);

            for (const [name, pos] of Object.entries(towers)) {
                ctx.beginPath(); ctx.arc(pos.x, pos.y, 15, 0, Math.PI * 2);
                ctx.fillStyle = pos.color; ctx.fill();
                ctx.fillStyle = '#fff'; ctx.font = 'bold 14px sans-serif';
                ctx.fillText(name, pos.x - 5, pos.y + 5);
            }

            ctx.beginPath();
            ctx.moveTo(towers[activeTower].x, towers[activeTower].y);
            ctx.lineTo(user.x, user.y);

            let currentRsrp = activeTower === 'A' ? rsrpA : rsrpB;
            if (currentRsrp > -70) ctx.strokeStyle = towers[activeTower].color;
            else if (currentRsrp > -90) ctx.strokeStyle = '#eab308';
            else ctx.strokeStyle = '#ef4444';

            ctx.lineWidth = 3;
            ctx.stroke();

            ctx.beginPath(); ctx.arc(user.x, user.y, 8, 0, Math.PI * 2);
            ctx.fillStyle = '#fff'; ctx.fill();

            // Draw Timer HUD
            ctx.fillStyle = '#fff';
            ctx.font = 'bold 24px monospace';
            ctx.textAlign = 'right';
            ctx.fillText(`T-Minus: ${timeLeftStr}s`, canvas.width - 20, 35);
            ctx.textAlign = 'left';

            updateDashboard();

            // 10 Second Time Lock Logic
            if (elapsedMs < SIMULATION_DURATION_MS) {
                user.x += user.vx;
                user.y += user.vy;
                animationId = requestAnimationFrame(drawScene);
            } else {
                // Draw Simulation Complete Overlay
                ctx.fillStyle = 'rgba(0, 0, 0, 0.7)';
                ctx.fillRect(0, 0, canvas.width, canvas.height);
                ctx.fillStyle = '#38bdf8';
                ctx.font = 'bold 32px system-ui';
                ctx.textAlign = 'center';
                ctx.fillText('10.0s Simulation Complete', canvas.width / 2, canvas.height / 2);
                ctx.font = '18px system-ui';
                ctx.fillStyle = '#94a3b8';
                ctx.fillText('Data capture paused. Click Restart to run again.', canvas.width / 2, (canvas.height / 2) + 30);
                ctx.textAlign = 'left';
            }
        }

        function resetSim() {
            if (animationId) cancelAnimationFrame(animationId);
            user.x = 50; user.y = 320;
            activeTower = 'A';
            startTime = null; // Resets the high-resolution timer
            requestAnimationFrame(drawScene);
        }

        // Initialize first frame
        requestAnimationFrame(drawScene);
    </script>
</body>

</html>
